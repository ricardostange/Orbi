name: Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare compiler
        shell: bash
        run: |
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/eclipse/jdt/ecj/3.33.0/ecj-3.33.0.jar -o "$RUNNER_TEMP/ecj.jar"
          echo "f7686c4960cf70c2ebc5c500a73a8cfc04541b730c18f1c5c21329889b137f45  $RUNNER_TEMP/ecj.jar" | sha256sum --check
          echo "ECJ_JAR=$RUNNER_TEMP/ecj.jar" >> "$GITHUB_ENV"
      - name: Test commands
        run: bash scripts/test.sh
      - name: Install Android SDK packages
        if: github.event_name != 'pull_request'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-35/android.jar" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_ENV"
      - name: Build and verify signed APK
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Configure ANDROID_KEYSTORE_BASE64 in repository Actions secrets}"
          export KEYSTORE_PATH="$RUNNER_TEMP/orbi-signing.jks"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          export VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          bash build.sh
      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Orbi-APK-${{ github.run_number }}
          path: build/Assistente-Teste.apk
          if-no-files-found: error
          retention-days: 30
