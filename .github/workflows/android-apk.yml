name: Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test standalone agent probe
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Test, compile Kotlin and Compose, and lint
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --no-daemon
      - name: Build and verify signed APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Configure ANDROID_KEYSTORE_BASE64 in repository Actions secrets}"
          export KEYSTORE_PATH="$RUNNER_TEMP/orbi-signing.jks"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          export VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          gradle :app:assembleRelease --no-daemon
          mkdir -p build
          cp app/build/outputs/apk/release/app-release.apk build/Assistente-Teste.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs build/Assistente-Teste.apk | grep -F 'e7aacc33b1b7a65d3c86e8b6e489d133571f4eb589ea77c895465371e33cf69f' 
      - name: Upload APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Orbi-APK-${{ github.run_number }}
          path: build/Assistente-Teste.apk
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: orbi-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Orbi-APK-${{ github.run_number }}
          path: apk
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_NUMBER}"
          cp apk/Assistente-Teste.apk apk/Orbi.apk
          cat > notes.md <<'NOTES'
          ## Instalar no Android
          Toque em **Orbi.apk** abaixo, abra o arquivo baixado e confirme a instalação.
          A assinatura original foi preservada para atualizar o aplicativo existente.
          NOTES
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Orbi — build $GITHUB_RUN_NUMBER" --notes-file notes.md --draft
          fi
          gh release upload "$tag" apk/Orbi.apk --clobber
          gh release edit "$tag" --draft=false --latest
          echo '### Download direto do APK' >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/Orbi.apk" >> "$GITHUB_STEP_SUMMARY"

